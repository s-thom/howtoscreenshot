name: Update robots.txt

on:
  workflow_dispatch:
  schedule:
    - cron: "13 6 2 * *"

jobs:
  update-robots-txt:
    name: Update robots.txt
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create robots.txt
        uses: s-thom/create-robots-txt-action@70161b89572bd387476453c25f76e283578506a5 # v3.0.0
        with:
          output-file: public/robots.txt
          append-allow-rule: true
          allowed-bot-names: |
            Chrome-Lighthouse
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_RADAR_API_TOKEN }}
          cloudflare-categories: |
            AI_CRAWLER
            SEARCH_ENGINE_OPTIMIZATION
            ADVERTISING_AND_MARKETING
            MONITORING_AND_ANALYTICS
            AGGREGATOR
            SOCIAL_MEDIA_MARKETING
          known-agents-api-token: ${{ secrets.DARK_VISITORS_API_TOKEN }}
          known-agents-categories: |
            AI Data Scraper

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            public/robots.txt
          commit-message: "Update robots.txt"
          branch: robots-txt
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update robots.txt"
          body: |
            # Automated update of robots.txt

            Generated by [s-thom/create-robots-txt-action](https://github.com/s-thom/create-robots-txt-action)
